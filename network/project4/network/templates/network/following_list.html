{% extends "network/layout.html" %}
{% load static %}

{% block header %}
  <h1 class="text-center mt-4">Following List</h1>
{% endblock %}

{% block body %}
  <div class="following-list d-flex flex-column align-items-center text-center">
    {% for people in user.following.all %}
      <div class="card people mb-3" style="width: 18rem;">
        <div class="card-body">
          <h5 class="card-title">{{ people.username }}</h5>
          <input class="btn btn-primary unfollow" value="Unfollow" id="{{ people.id }}">
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}

{% block script %}
  <script src="{% static 'network/following_list.js' %}"></script>
{% endblock %}
